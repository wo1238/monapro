<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveSpell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Anton&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body class="body">
    
    <div class="page">
        <!-- TÍTULO -->
        <header class="hero">
            <div class="eyebrow-line">
                <span></span>
                ¡Bienvenid@ de vuelta!
                <span></span>
            </div>
    
            <h1 class="headline">
                Inicia sesion
                <br>
                en <em>Love Spell</em>
            </h1>
        </header>
    
        <!-- FORMULARIO -->
        <section class="form-section" id="registro">
    
            <p class="intro">
                Bienvenido de vuelta a nuestro pequeño rincon del internet.
            </p>
    
            <form method="post">
    
                <div class="field-row">
                
                    <div class="field">
                        <label for="user">Usuario</label>
                       <input type="text" name="usuario" id="user" placeholder="User" required size="20" maxlength="60">
                    </div>
    
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap">
                        <input type="password" name="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                        <button type="button" class="toggle-pass" onclick="togglePass()">Ver</button>
                    </div>
                </div>
    </div>

                <input type="submit" name="enviar" id="enviar" value="Enviar">

            </form>
            <br>     <label class="checkbox-line">
                   
                     <a href="./Cambiar_contraseña.html" >¿Olvidaste tu contraseña?</a>
                </label>

              
                    <label class="checkbox-line">
                   
                    ¿No formas parte de la familia? <a href="./Registrarse.html">Registrate</a>
                </label>


        </section>
        <br><br>
 <label class="checkbox-line">
                   
                     <a href="../Index.html">¿De vuelta a casa?</a>
                </label>

        <p class="footer">&copy; 2026 LoveSpell — Todos los derechos reservados</p>

    </div>

    <script>
        function togglePass(){
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-pass');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.textContent = showing ? 'Ver' : 'Ocultar';
        }
    </script>

</body>
</html>
