<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveSpell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Anton&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/Registrarse.css">
</head>
<body class="body">

    <div class="page">

        <!-- TÍTULO -->
        <header class="hero">
            <div class="eyebrow-line">
                <span></span>
                ÚNETE A NUESTRA FAMILIA
                <span></span>
            </div>

            <h1 class="headline">
                Crea tu cuenta
                <br>
                en <em>Love Spell</em>
            </h1>
        </header>

        <!-- FORMULARIO -->
        <section class="form-section" id="registro">

            <p class="intro">
                Regístrate y sé de los primeros en enterarte de nuevas colecciones de
                chocolates, flores y detalles especiales.
            </p>

            <form method="post">

                <div class="field-row">
                    <div class="field">
                        <label for="nombres">Nombres</label>
                        <input type="text" name="Nombres" id="nombres" placeholder="Nombres completos" required size="20" maxlength="50">
                    </div>
                    <div class="field">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" name="Apellidos" id="apellidos" placeholder="Apellidos completos" required size="20" maxlength="50">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="fecha-nacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fecha-nacimiento" name="Fecha de nacimiento" required>
                    </div>
                    <div class="field">
                        <label>Genero</label>
                        <div class="chip-group">
                            <label class="chip">
                                <input type="radio" id="hombre" name="Genero" value="hombre" required>
                                <span>Hombre</span>
                            </label>
                            <label class="chip">
                                <input type="radio" id="mujer" name="Genero" value="mujer" required>
                                <span>Mujer</span>
                            </label>
                            <label class="chip">
                                <input type="radio" id="otra" name="Genero" value="otro" required>
                                <span>Otra</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="correo" placeholder="tucorreo@ejemplo.com" required maxlength="500">
                    </div>
                    <div class="field">
                        <label for="user">Usuario</label>
                        <input type="text" name="usuario" id="user" placeholder="User" required size="20" maxlength="60">
                    </div>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap">
                        <input type="password" name="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6" maxlength="100">
                        <button type="button" class="toggle-pass" onclick="togglePass()">Ver</button>
                    </div>
                </div>

                <label class="checkbox-line">
                    <input type="checkbox" id="novedades" name="novedades y ofertas" checked>
                    Deseo recibir información sobre novedades y ofertas
                </label>

                <label class="checkbox-line">
                    <input type="checkbox" id="condiciones" name="condiciones" required>
                    Declaro haber leído y aceptar los <a href="./Terminosycondiciones.html">términos y condiciones</a>
                </label>

                <input type="submit" name="enviar" id="enviar" value="Enviar">

            </form>
            <br>

         
                <label class="checkbox-line">
                   
                    ¿Ya eres parte? <a href="./Login.html">Inicia sesión</a>
                </label>


        </section>
     <br><br>
 <label class="checkbox-line">
                   
                     <a href="../Index.html">¿De vuelta a casa?</a>
                </label>
        <p class="footer">&copy; 2026 LoveSpell— Todos los derechos reservados</p>

    </div>

    <script>
        function togglePass(){
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-pass');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.textContent = showing ? 'Ver' : 'Ocultar';
        }
    </script>

</body>
</html>
