    <script>
        function togglePass(){
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-pass');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.textContent = showing ? 'Ver' : 'Ocultar';
        }
    </script>
