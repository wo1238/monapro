<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveSpell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Anton&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Categorias_Catalogo.css">
</head>
<body class="body">

    <div class="page">

        <!-- TÍTULO -->
        <header class="hero">
            <div class="eyebrow-line">
                <span></span>
                Make the difference
                <span></span>
            </div>

            <h1 class="headline">
               Regalos tan unicos 
                <br>
                como tu <em>amor</em>
            </h1>
        </header>

        <!-- FORMULARIO -->
        <section class="form-section" id="registro">

            <p class="intro">
                Crea tu detalle parte por parte, e impregnalos de tu cariño.
            </p>

            <form method="post">

                <div class="field-row">
                    <div class="field">
                        <label for="nombres">Nombres Comprador</label>
                        <input type="text" name="Nombres " id="nombres" placeholder="Nombres completos" required size="20" maxlength="50">
                    </div>
                    <div class="field">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" name="Apellidos" id="apellidos" placeholder="Apellidos completos" required size="20" maxlength="50">
                    </div>
                </div>
            

                <div class="field-row">
                    <div class="field">
                        <label for="nombres">Nombre Afortunada/o</label>
                        <input type="text" name="Nombres " id="nombres" placeholder="Nombres completos" required size="20" maxlength="50">
                    </div>
                    <div class="field">
                        <label>Relacion</label>
                        <div class="chip-group">
                            <label class="chip">
                                <input type="radio" id="pareja" name="relacion" value="pareja" required>
                                <span>Pareja</span>
                            </label>
                             <label class="chip">
                                <input type="radio" id="familia" name="relacion" value="Familia" required>
                                <span>Familia</span>
                            </label>
                            <label class="chip">
                                <input type="radio" id="amigos" name="relacion" value="amigos" required>
                                <span>Amigos</span>
                            </label>
                            <label class="chip">
                                <input type="radio" id="complicado" name="relacion" value="complicado" required>
                                <span>complicado</span>
                            </label>
                        </div>
                    </div>
                </div>
            

                <div class="field-row">
                    <div class="field">
                        <label for="fecha-nacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fecha-nacimiento" name="Fecha de nacimiento" required>
                    </div>
                    <div class="field">
                        <label>Genero Afortunada/o</label>
                        <div class="chip-group">
                            <label class="chip">
                                <input type="radio" id="hombre" name="Genero" value="hombre" required>
                                <span>Hombre</span>
                            </label>
                            <label class="chip">
                                <input type="radio" id="mujer" name="Genero" value="mujer" required>
                                <span>Mujer</span>
                            </label>
                            <label class="chip">
                                <input type="radio" id="otra" name="Genero" value="otro" required>
                                <span>Otra</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="correo" placeholder="tucorreo@ejemplo.com" required maxlength="500">
                    </div>
                    <div class="field">
                        <label for="telefono">Numero de telefono</label>
                        <input type="text" name="telefono" id="telefono" placeholder="Telefono" required size="20" maxlength="60">
                    </div>
                </div>

                <label class="checkbox-line">
                    <input type="checkbox" id="novedades" name="novedades y ofertas" >
                    Autorizo que se me contacte para el pedido personalizado
                </label>

                <label class="checkbox-line">
                    <input type="checkbox" id="condiciones" name="condiciones" required>
                    Declaro haber leído y aceptar los <a href="./Terminosycondiciones.html">T&C personalizados  </a>
                </label>

                <input type="submit" name="enviar" id="enviar" value="Enviar">

            </form>
            <br>

         
                <label class="checkbox-line">
                   
                    Mira que  <a href="../Catalogo.html">ofrecemos</a>
                </label>


        </section>
     <br><br>
 <label class="checkbox-line">
                   
                     <a href="../Homepage.html">¿De vuelta a casa?</a>
                </label>
        <p class="footer">&copy; 2026 LoveSpell— Todos los derechos reservados</p>

    </div>

    <script>
        function togglePass(){
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-pass');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.textContent = showing ? 'Ver' : 'Ocultar';
        }
    </script>

</body>
</html>
